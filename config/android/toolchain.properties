# DungeonLike -- Android toolchain single source of truth.
#
# This file is the ONLY authoritative declaration of the Android SDK, build tools,
# NDK, CMake, ABI and Java requirements for the project. Build scripts and GitHub
# Actions workflows MUST read these values from this file instead of restating
# them, so that a toolchain bump is a single-line, reviewable change.
# `scripts/validate_toolchain.py` fails CI if a workflow hardcodes a value owned here.
#
# Format: java.util.Properties (key=value, '#' comments). Kept deliberately
# dependency-free so shell, Python and Gradle can all parse it.

# --- Platform / API levels -------------------------------------------------
#
# Android introduced *minor* SDK versions starting with API 36.1, so an API level
# is now a (major, minor) pair. The SDK package id is "platforms;android-<major>.<minor>".
#
# minSdk 34 (Android 14) is a product requirement: DungeonLike does not support
# pre-34 devices, which removes a large volume of legacy compatibility branching.
sdk.min=34

# Compile against the highest stable minor of API 37. Verified present on the
# *stable* channel of https://dl.google.com/android/repository/repository2-3.xml
# as "platforms;android-37.2" (SDK extension level 24).
sdk.compile=37
sdk.compile.minor=2

# Target the same level we compile against so that no opt-in behaviour change is
# silently deferred. Raising this is an explicit, release-gated decision.
sdk.target=37
sdk.target.minor=2

# SDK extension level shipped by platforms;android-37.2. Recorded so that code
# using extension-gated APIs can assert the floor it was compiled against.
sdk.extension=24

# --- Build tools -----------------------------------------------------------
#
# "build-tools;37.0.0" is the only stable 37.x build-tools release available.
build.tools=37.0.0

# --- Native toolchain ------------------------------------------------------
#
# Pinned to the NDK revision that Godot 4.7.2 builds its Android library with
# (platform/android/java/app/config.gradle). Diverging from the engine's NDK is a
# known source of subtle STL/linker mismatches, so this is intentionally coupled.
ndk=29.0.14206865
cmake=4.1.2

# --- ABI -------------------------------------------------------------------
#
# 64-bit only, by product requirement. arm64-v8a is the sole shipped ABI: no
# 32-bit ARM, and no x86_64 (emulator-only) slice in release artifacts. Keeping a
# single ABI also keeps the premium app's download size down.
abi.filters=arm64-v8a

# --- Java ------------------------------------------------------------------
#
# 17 is the verified floor from two independent constraints:
#   * AGP 9.4.0 is compiled to Java 17 bytecode (class file major version 61).
#   * Godot 4.7.2's Android library declares JavaVersion.VERSION_17.
# Both source/target compatibility and the CI JDK use this value.
java.version=17

# --- Gradle / plugin baseline ---------------------------------------------
#
# Declared here because CI provisions the wrapper before any Gradle project
# exists. `gradle/libs.versions.toml` mirrors the AGP value for the build
# itself; validate_toolchain.py asserts the two stay in agreement.
gradle.version=9.7.1
agp.version=9.4.0

# Kotlin is NOT independently pinned. From AGP 9.0 onward Kotlin support is
# built into the Android Gradle plugin, which carries its own Kotlin Gradle
# plugin as a runtime dependency; the `org.jetbrains.kotlin.android` plugin is
# rejected outright and must not be applied.
#
# 2.2.10 is the version AGP 9.4.0 declares in its published POM
# (com.android.tools.build:gradle:9.4.0 -> org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10),
# so it is the version the build actually compiles with. AGP documents how to
# force a higher one, and that is deliberately not done: it would mean shipping
# an AGP/Kotlin combination the plugin vendor never tested, for no product
# benefit. This is the same reasoning ADR 0003 applies to the NDK -- deliberate
# coupling is the cheaper failure mode.
#
# Recorded here so the value is discoverable and asserted rather than implicit.
# It changes when AGP changes, so re-read AGP's POM at every AGP bump.
kotlin.version=2.2.10

# --- Engine ----------------------------------------------------------------
#
# Godot 4.7.2-stable, standard (non-.NET) build, scripted in GDScript.
#
# The standard engine is published to MavenCentral as `org.godotengine:godot`,
# with a GPG signature and SHA-256/SHA-512 checksums, so it resolves as an
# ordinary Gradle dependency and can be verified automatically. The .NET/C#
# variant is deliberately NOT used: it is distributed only as a GitHub release
# asset, with no package-manager provenance. See docs/architecture/adr/0002.
godot.version=4.7.2
godot.channel=stable
