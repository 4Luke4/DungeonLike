# Android toolchain — the single source of truth.
#
# Workflows, build scripts and documentation READ these values; none of them may
# restate a value declared here. Every entry below was taken from an upstream
# primary source, and the reasoning is recorded so that a future bump is a
# decision rather than a guess.

# --- Platform --------------------------------------------------------------
# API level 37.2 with SDK extension 24 is the `platforms;android-37.2` package
# published in Google's SDK repository manifest, which reports
# api-level=37.2 and extension-level=24. Only the COMPILE SDK can express a
# minor release and an extension level: the AGP DSL exposes minorApiLevel and
# sdkExtension on CompileSdkSpec.release(), while TargetSdkSpec.release() and
# MinSdkSpec.release() accept a plain API level only.
android.compileSdk=37
android.compileSdkMinor=2
android.compileSdkExtension=24
android.targetSdk=37

# Android 14. The product targets modern 64-bit phones and tablets only.
android.minSdk=34

# Stable build tools for API 37, published as `build-tools;37.0.0`. This is
# above the 36.0.0 minimum that the Android Gradle plugin requires.
android.buildTools=37.0.0

# No NDK revision is pinned, and that is a decision rather than an omission.
# The project ships no native code of its own: the engine's native libraries
# arrive already built inside the Godot Android archive, and packaging them
# needs no NDK. Pinning one would add roughly a gigabyte to every clean build
# for nothing. When native code is added, pin the revision here — the Android
# Gradle plugin's own default at the time of writing is 28.2.13676358 — and set
# ndkVersion in app/build.gradle.kts from this value.

# 64-bit ARM only, matching the documented product scope. Filtering here also
# removes the other architectures shipped inside the engine's Android archive,
# which would otherwise inflate the bundle.
android.abi=arm64-v8a

# --- Build toolchain -------------------------------------------------------
# Android Gradle plugin 9.4.0, the current stable release: it is the newest
# plugin whose documented maximum supported API level is 37, which the compile
# SDK above requires.
build.androidGradlePlugin=9.4.0

# There is deliberately NO separate Kotlin version here. AGP 9 introduced
# built-in Kotlin support and it is enabled by default, so the Kotlin compiler
# ships with the Android Gradle plugin and the org.jetbrains.kotlin.android
# plugin is not merely unnecessary but incompatible with AGP 9's DSL. Every
# module in this build therefore applies an AGP plugin and shares one Kotlin
# compiler; adding the Kotlin Gradle plugin back would reintroduce an
# AGP-to-Kotlin compatibility matrix that the project does not need.

# Gradle 9.7.1, the current stable release. AGP 9.4 requires 9.6.0 or newer.
build.gradle=9.7.1

# JDK 17 is the minimum the Android Gradle plugin requires and the Java level
# the Godot Android library itself is compiled against, so the host and the
# engine agree on bytecode level.
build.java=17

# --- Engine ----------------------------------------------------------------
# The Godot Android library consumed as a dependency. The editor and export
# templates downloaded by CI MUST match this exact version: the engine that
# exports the pack and the engine that loads it are the same build.
godot.version=4.7.2.stable
godot.releaseTag=4.7.2-stable

# --- Verification tooling --------------------------------------------------
# GUT (Godot Unit Test) release used by the GDScript test job.
tools.gut=9.6.1
