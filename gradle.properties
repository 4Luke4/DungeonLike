# Gradle build behaviour for DungeonLike.
#
# Values that describe the Android toolchain do NOT belong here: they are owned
# by config/android/toolchain.properties (ADR 0003) and injected by
# settings.gradle.kts.

# --- Correctness -------------------------------------------------------------
#
# AndroidX is the only supported support-library lineage; the legacy one is
# unmaintained. Jetifier stays off because nothing in the dependency graph is a
# pre-AndroidX artifact, and enabling it would rewrite bytecode on every build.
android.useAndroidX=true
android.enableJetifier=false

# Each module gets an R class containing only its own resources. This keeps the
# dex smaller and makes an accidental dependency on a library's resources a
# compile error rather than a silent coupling.
android.nonTransitiveRClass=true

# --- Build speed and reproducibility ----------------------------------------
#
# The configuration cache is the single largest build-time win available, and
# enabling it from the first commit is far cheaper than retrofitting it once
# incompatible build logic has accumulated.
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

# The default daemon heap is not enough for R8 on a release build. Set
# explicitly so behaviour does not depend on the machine's defaults, and so a
# CI runner and a workstation agree.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# --- Kotlin ------------------------------------------------------------------
#
# Run the Kotlin compiler inside the Gradle daemon rather than spawning a second
# long-lived JVM. On a CI runner, which builds once and exits, the extra process
# is pure overhead.
kotlin.compiler.execution.strategy=in-process
