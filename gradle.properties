# Gradle build properties.
#
# Only settings that differ from the defaults of the pinned Gradle and Android
# Gradle plugin versions are declared here. Restating a default would create a
# second place to maintain when that default changes.

# Memory for the Gradle daemon. The Android Gradle plugin, R8 and the Kotlin
# compiler run in this JVM; 4 GB keeps CI runners and developer machines off the
# garbage-collection cliff without reserving more than a hosted runner has.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Build speed. The project is small today, but these are the settings the CI
# cache is measured against, so they are enabled from the start rather than
# retrofitted once builds are slow.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Fail loudly instead of silently degrading when a task is not cacheable or a
# configuration-cache problem appears.
org.gradle.configuration-cache.problems=fail
