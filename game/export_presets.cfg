; Godot export presets.
;
; This project is exported only as a game PACK. The Android application itself
; is built by Gradle in app/, which embeds the engine as a library and loads the
; pack at start-up, so the packaging, signing, versioning and architecture of
; the shipped binary are all decided by the Gradle build and not here.
;
; Continuous integration runs:
;   godot --headless --path game --export-pack "Android" ../app/src/main/assets/game.pck
;
; The preset is still an Android one because the platform decides which imported
; resource variants are written into the pack — a desktop preset would write
; desktop texture formats into a pack that only ever runs on Android.
;
; Deliberately absent: package/unique_name, version/code and version/name. They
; would be a second place where the application id and the version are written
; down, and the values that actually ship come from
; config/android/toolchain.properties and VERSION through the Gradle build.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; 64-bit ARM only, matching android.abi in config/android/toolchain.properties.
; The architecture flags do not affect a pack export, but leaving an
; unsupported architecture enabled here would misdescribe the product to anyone
; reading this file.
architectures/arm64-v8a=true
architectures/armeabi-v7a=false
architectures/x86=false
architectures/x86_64=false

; The host application owns the Gradle build; the engine must not generate one.
gradle_build/use_gradle_build=false
