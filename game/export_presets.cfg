; Godot export presets.
;
; Committed and reviewable on purpose: the preset decides what ends up inside
; the shipped pack, so it belongs in review rather than in someone's editor.
; Secrets such as keystore passwords live in `export_credentials.cfg`, which is
; git-ignored and never present in CI (SECURITY.md).
;
; Only a pack export is performed. The Android *binary* is built by Gradle from
; the Kotlin host, which embeds the engine as a library; the engine's own
; platform template is not used, so this preset exists solely to produce
; `game.pck` for `--main-pack`.

[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

; 64-bit ARM only, matching abi.filters in config/android/toolchain.properties.
; These flags affect which architecture-tagged resources the exporter considers;
; the shipped native libraries themselves come from the engine's AAR via Gradle.
architectures/armeabi-v7a=false
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false

; Texture formats. ETC2/ASTC is what the project imports for Android; no legacy
; ETC1 fallback is needed because minSdk is 34.
texture_format/etc2_astc=true
texture_format/s3tc_bptc=false
