# Gradle wrapper configuration.
#
# `distributionSha256Sum` is the SHA-256 that Gradle publishes for this exact
# distribution (services.gradle.org/versions/all -> "checksum"). With it set, the
# wrapper refuses to run a distribution whose bytes do not match, so a tampered
# or substituted archive fails closed instead of executing.
#
# The Gradle version is owned by `config/android/toolchain.properties`
# (gradle.version). It is unavoidably restated here because the wrapper reads
# this file before any build logic exists to resolve it; keep the two in step
# when bumping, and regenerate through the `bootstrap` job in `android.yml`
# rather than by hand.
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-9.7.1-bin.zip
distributionSha256Sum=acd53f1edaf02f1a8ff99879f8a34b302661a057d9b063ae9e35b552f804d20a
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
