name: CodeQL

# Static security analysis.
#
# Two languages are analysed and one is deliberately absent:
#
#   java-kotlin  the Android host, in build-mode `manual`. Buildless analysis
#                was tried first and worked until the Gradle wrapper was
#                committed, at which point the extractor stopped producing a
#                database at all and failed with "could not process any code
#                written in Java/Kotlin". Watching a real compilation is the
#                mode CodeQL documents for Kotlin in any case, and it yields a
#                more complete database than reading source alone, so the build
#                is worth the minutes it costs.
#   actions      the workflows themselves. Workflow permissions and untrusted
#                input handling are a real attack surface for a public
#                repository, and this is the only job that inspects them.
#
# GDScript is not a language CodeQL supports. The game core is covered by gdlint
# and by the repository's own checks in tools/scripts/ instead; the gap is
# recorded in docs/release/READINESS.md so that it stays a known limitation
# rather than an assumed absence of findings.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, so that newly published queries reach the default branch even
    # during a quiet period.
    - cron: "41 9 * * 5"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      # Required to upload the results to the security tab.
      security-events: write
      # Required to fetch the CodeQL query packs.
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # The Android toolchain, read from the one file that owns it so this
      # workflow cannot drift from the build it is analysing.
      - name: Read the toolchain
        if: matrix.build-mode == 'manual'
        id: toolchain
        run: |
          set -euo pipefail
          properties=config/android/toolchain.properties
          read_property() { sed -n "s/^${1}=//p" "${properties}" | tr -d '\r'; }
          {
            echo "java=$(read_property 'build.java')"
            echo "build-tools=$(read_property 'android.buildTools')"
            echo "compile-sdk=$(read_property 'android.compileSdk').$(read_property 'android.compileSdkMinor')"
          } >> "$GITHUB_OUTPUT"

      - name: Set up the build toolchain
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ steps.toolchain.outputs.java }}

      - name: Set up the Android SDK
        if: matrix.build-mode == 'manual'
        uses: android-actions/setup-android@v4.0.1
        with:
          packages: >-
            platforms;android-${{ steps.toolchain.outputs.compile-sdk }}
            build-tools;${{ steps.toolchain.outputs.build-tools }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The extended suites add correctness and maintainability queries on
          # top of the default security set.
          queries: security-extended,security-and-quality

      # CodeQL watches this compilation to build its database, so the build has
      # to happen between init and analyze. Only the classes are needed, not a
      # packaged application, so the cheapest task that compiles everything is
      # used rather than assembling a bundle.
      - name: Build the Kotlin sources
        if: matrix.build-mode == 'manual'
        run: ./gradlew --no-daemon :host-core:compileDebugKotlin :app:compileDebugKotlin

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
