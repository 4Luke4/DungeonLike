name: CodeQL

# Static security analysis.
#
# Two languages are analysed and one is deliberately absent:
#
#   java-kotlin  the Android host, in build-mode `none`. Buildless analysis
#                needs no Android SDK, no Gradle and no engine download, which
#                is the difference between a few minutes and a quarter of an
#                hour for a scan that reads the same source either way.
#   actions      the workflows themselves. Workflow permissions and untrusted
#                input handling are a real attack surface for a public
#                repository, and this is the only job that inspects them.
#
# GDScript is not a language CodeQL supports. The game core is covered by gdlint
# and by the repository's own checks in tools/scripts/ instead; the gap is
# recorded in docs/release/READINESS.md so that it stays a known limitation
# rather than an assumed absence of findings.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, so that newly published queries reach the default branch even
    # during a quiet period.
    - cron: "41 9 * * 5"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    permissions:
      # Required to upload the results to the security tab.
      security-events: write
      # Required to fetch the CodeQL query packs.
      packages: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: none
          - language: actions
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The extended suites add correctness and maintainability queries on
          # top of the default security set.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
