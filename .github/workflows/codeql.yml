name: CodeQL

# Static security analysis.
#
# The previous version of this file declared `strategy.matrix.include:` with
# nothing but comments underneath it. An empty matrix produces zero jobs, so the
# workflow reported success while analysing nothing at all — a false assurance,
# which is worse than having no scan. The matrix below is explicit.
#
# Only `actions` is analysed today because workflow definitions are the sole
# analysable code in the repository. A `java-kotlin` entry is added by the pull
# request that introduces the Android host module.
#
# The GDScript game core will NOT be covered: CodeQL does not support GDScript.
# That gap is a known, deliberate consequence of the engine decision and is
# recorded in docs/architecture/adr/0002-engine-and-ui-architecture.md and in the
# threat model, along with its mitigations.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so that newly published queries are applied to unchanged code.
    - cron: "23 8 * * 5"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # Required to upload results to the code scanning dashboard.
      security-events: write
      # Required to fetch CodeQL query packs.
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # The extended suites add correctness and maintainability queries on
          # top of the default security set. The repository is small, so the
          # extra analysis time is worth the coverage.
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
