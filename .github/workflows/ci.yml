name: CI

# The pipeline that decides whether a change is verified. Nothing in this
# repository is executed on a contributor's machine, so these jobs are the only
# place the build, the tests and the export are ever really run.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A new push supersedes the previous run on the same branch. The bundle job
# downloads more than a gigabyte, so letting outdated runs finish is expensive
# rather than merely untidy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Reads the single source of truth once and hands the values to every other
  # job. Without this, each job would restate the SDK and engine versions and
  # the repository would have four places to update instead of one.
  toolchain:
    name: Resolve toolchain
    runs-on: ubuntu-24.04
    outputs:
      java: ${{ steps.read.outputs.java }}
      gradle: ${{ steps.read.outputs.gradle }}
      compile-sdk: ${{ steps.read.outputs.compile-sdk }}
      build-tools: ${{ steps.read.outputs.build-tools }}
      godot-version: ${{ steps.read.outputs.godot-version }}
      gut: ${{ steps.read.outputs.gut }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Read config/android/toolchain.properties
        id: read
        run: |
          set -euo pipefail
          properties=config/android/toolchain.properties
          read_property() { sed -n "s/^${1}=//p" "${properties}" | tr -d '\r'; }

          {
            echo "java=$(read_property 'build.java')"
            echo "gradle=$(read_property 'build.gradle')"
            echo "build-tools=$(read_property 'android.buildTools')"
            echo "godot-version=$(read_property 'godot.version')"
            echo "gut=$(read_property 'tools.gut')"
            # The SDK manager addresses the platform by its full minor version.
            echo "compile-sdk=$(read_property 'android.compileSdk').$(read_property 'android.compileSdkMinor')"
          } >> "$GITHUB_OUTPUT"

      - name: Report the resolved toolchain
        run: |
          echo "Java ${{ steps.read.outputs.java }}, Gradle ${{ steps.read.outputs.gradle }}"
          echo "Android platform ${{ steps.read.outputs.compile-sdk }}"
          echo "Build tools ${{ steps.read.outputs.build-tools }}"
          echo "Godot ${{ steps.read.outputs.godot-version }}"

  # Consistency checks that need nothing but Python. They run first because they
  # catch the mistakes that are cheapest to make and cheapest to fix.
  meta:
    name: Metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Version is consistent across VERSION, CHANGELOG.md and project.godot
        run: python3 tools/scripts/check_version.py

      - name: Every shipped language is declared everywhere and fully translated
        run: python3 tools/scripts/check_locales.py

      - name: All randomness goes through RngService
        run: python3 tools/scripts/check_rng_usage.py

  gradle:
    name: Kotlin host
    needs: toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ needs.toolchain.outputs.java }}

      - name: Validate the Gradle wrapper
        # Guarded because the wrapper is generated by the bootstrap workflow and
        # may not be committed yet; once it is, this verifies on every run that
        # the jar is an official Gradle release rather than an altered one.
        if: hashFiles('gradle/wrapper/gradle-wrapper.jar') != ''
        uses: gradle/actions/wrapper-validation@v6.3.0

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: ${{ needs.toolchain.outputs.gradle }}
          # Only the default branch writes the shared dependency and build
          # cache; a pull request reads it. A branch cannot poison the cache
          # every other branch relies on.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: >-
            platforms;android-${{ needs.toolchain.outputs.compile-sdk }}
            build-tools;${{ needs.toolchain.outputs.build-tools }}

      - name: Report the resolved toolchain
        run: gradle --no-daemon toolchainReport

      - name: Unit tests
        run: gradle --no-daemon :host-core:testDebugUnitTest :app:testDebugUnitTest

      - name: Android Lint
        run: gradle --no-daemon :host-core:lintDebug :app:lintDebug

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gradle-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.sarif
          if-no-files-found: ignore
          retention-days: 14

  godot:
    name: Game core
    needs: toolchain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install GDScript tooling
        run: pip install --requirement tools/requirements.txt

      - name: Formatting
        # --diff so a failure shows exactly what differs. Without it the job
        # reports only which files are wrong, which is not enough to act on
        # when the formatter is deliberately never run on a contributor's
        # machine.
        run: gdformat --check --diff $(find game -name '*.gd')

      - name: Lint
        run: gdlint $(find game -name '*.gd')

      # The editor and its export templates are about 1.3 GB, so they are cached
      # against the pinned version rather than downloaded on every run.
      - name: Restore the pinned Godot editor
        id: godot-cache
        uses: actions/cache@v6.1.0
        with:
          path: .godot-toolchain
          key: godot-editor-${{ needs.toolchain.outputs.godot-version }}-linux-x86_64

      - name: Download and verify the Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/scripts/fetch_godot.sh .godot-toolchain

      - name: Install GUT
        # A development-only dependency, so it is fetched at test time rather
        # than vendored into the repository; it never reaches the shipped game.
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v${{ needs.toolchain.outputs.gut }} \
            https://github.com/bitwes/Gut.git .gut-source
          mkdir -p game/addons
          cp -r .gut-source/addons/gut game/addons/gut

      - name: Import project resources
        # Imports have to finish before the test suite runs, or GUT's own
        # classes are not registered yet and every suite fails to resolve
        # GutTest.
        run: .godot-toolchain/godot --headless --import --path game

      - name: Run the GUT suite
        run: |
          set -euo pipefail
          .godot-toolchain/godot --headless --path game \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests/unit -ginclude_subdirs -gexit -glog=2

  bundle:
    name: Bundle
    # Only runs once the code that goes into it has been checked, so a failing
    # test never spends a gigabyte of download producing an artifact nobody
    # should install.
    needs: [toolchain, meta, gradle, godot]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ needs.toolchain.outputs.java }}

      - uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: ${{ needs.toolchain.outputs.gradle }}
          cache-read-only: true

      - uses: android-actions/setup-android@v4.0.1
        with:
          packages: >-
            platforms;android-${{ needs.toolchain.outputs.compile-sdk }}
            build-tools;${{ needs.toolchain.outputs.build-tools }}

      - name: Restore the pinned Godot editor
        id: godot-cache
        uses: actions/cache@v6.1.0
        with:
          path: .godot-toolchain
          key: godot-editor-${{ needs.toolchain.outputs.godot-version }}-linux-x86_64

      - name: Download and verify the Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: tools/scripts/fetch_godot.sh .godot-toolchain

      - name: Export the game pack
        run: |
          set -euo pipefail
          # Imports first: the export writes whatever the import step produced,
          # and an unimported project exports an empty pack rather than failing.
          .godot-toolchain/godot --headless --import --path game

          mkdir -p app/src/main/assets
          # A pack export needs no export templates, no Android SDK and no
          # keystore: for a .pck path the engine calls export_pack() directly,
          # and the Android platform does not override it. See the comment in
          # tools/scripts/fetch_godot.sh. The path must be absolute because the
          # engine resolves it relative to the project directory otherwise.
          .godot-toolchain/godot --headless --path game \
            --export-pack "Android" "${GITHUB_WORKSPACE}/app/src/main/assets/game.pck"

          # The activity loads res://game.pck at start-up; an export that
          # silently produced nothing would otherwise surface as a blank screen
          # on a device instead of a failed build.
          test -s app/src/main/assets/game.pck

      - name: Assemble the debug application
        # Unsigned on purpose: no signing material exists in this repository or
        # in these runners. Release signing happens in a protected environment;
        # see docs/release/READINESS.md.
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Upload the debug artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dungeonlike-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
          if-no-files-found: error
          retention-days: 14
