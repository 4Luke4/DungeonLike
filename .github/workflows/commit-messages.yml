name: Commit messages

# Enforces the commit format described in .gitmessage: Conventional Commits
# 1.0.0 with this repository's allowed types and a subject of at most 100
# characters.
#
# The check runs on pull requests only. Rewriting history on the default branch
# to fix a subject would be worse than the subject.

on:
  pull_request:
    branches: ["main"]

concurrency:
  group: commit-messages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-24.04
    # Dependabot's subjects are generated by Dependabot, and the prefixes it
    # uses are already configured in .github/dependabot.yml. Failing its pull
    # requests here would block updates nobody can reword.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The validator walks base..head, so both ends of the range must be
          # present in the clone.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      - name: Validate the commits in this pull request
        run: |
          python3 tools/scripts/check_commit_messages.py \
            "origin/${{ github.base_ref }}" \
            "${{ github.event.pull_request.head.sha }}"
