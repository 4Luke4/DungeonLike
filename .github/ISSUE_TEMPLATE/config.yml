# Blank issues are disabled so that every report arrives with the context the
# maintainers need. Security reports are routed to private advisories instead of
# the public tracker.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/4Luke4/DungeonLike/security/advisories/new
    about: Report privately through GitHub Security Advisories. Never open a public issue for a vulnerability.
  - name: Ask a question or discuss an idea
    url: https://github.com/4Luke4/DungeonLike/discussions
    about: Open-ended questions and design discussion belong in Discussions.
