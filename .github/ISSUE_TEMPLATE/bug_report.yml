name: 🐛 Bug report
description: Report something in DungeonLike that does not work as expected.
title: "bug: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **Do not report security vulnerabilities here.** Use the
        [private advisory flow](https://github.com/4Luke4/DungeonLike/security/advisories/new)
        instead — see `SECURITY.md`.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the problem.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Precise steps someone else can follow to see the problem.
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include exact error text. Attach a screenshot or recording if it helps.
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version
      description: From the app's about screen, or the commit SHA if you built it.
      placeholder: "0.1.0"
    validations:
      required: true

  # Device class, Android version, locale, and input mode are collected because
  # each maps to a distinct supported configuration (adaptive layout, API level
  # behaviour, localization, and input handling). Without them a report is
  # usually not actionable.
  - type: dropdown
    id: device-class
    attributes:
      label: Device class
      options:
        - Smartphone
        - Tablet
        - Foldable
        - Other / not sure
    validations:
      required: true

  - type: input
    id: device-model
    attributes:
      label: Device model
      placeholder: "e.g. Pixel 9 Pro"
    validations:
      required: true

  - type: dropdown
    id: android-version
    attributes:
      label: Android version
      description: DungeonLike requires Android 14 (API 34) or newer.
      options:
        - "Android 14 (API 34)"
        - "Android 15 (API 35)"
        - "Android 16 (API 36)"
        - "Android 17 (API 37)"
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: locale
    attributes:
      label: App language
      options:
        - English
        - Italiano
        - Español
        - Français
        - Deutsch
    validations:
      required: true

  - type: dropdown
    id: input-mode
    attributes:
      label: Input method in use
      description: Mouse and keyboard are fully supported, so this affects triage.
      options:
        - Touch
        - Mouse
        - Physical keyboard
        - Mouse and keyboard
        - Gamepad
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: regression
    attributes:
      label: Did this work before?
      options:
        - "No — it has always behaved this way"
        - "Yes — it is a regression"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: >-
        Relevant `adb logcat` output or a crash trace, if you have one.
        **Redact any personal information first.** This is automatically
        formatted as code.
      render: text

  - type: textarea
    id: context
    attributes:
      label: Additional context
